<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whisper Live — Ultra-Fast Multi-Channel STT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --bg-card: #111726;
      --bg-card-hover: #151d30;
      --bg-input: #0c1220;
      --edge: #1e293f;
      --edge-focus: #3b82f6;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --ok: #10b981;
      --ok-glow: rgba(16, 185, 129, 0.2);
      --warn: #f59e0b;
      --err: #ef4444;
      --live-red: #f43f5e;
      --nastaliq: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", serif;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      line-height: 1.5;
    }

    .wrap {
      width: 100%;
      max-width: 1300px;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--edge);
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .system-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .stat-chip {
      background: var(--bg-card);
      border: 1px solid var(--edge);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
    }

    .stat-chip.live-tag {
      color: var(--ok);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.08);
    }

    /* Control Panels */
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button,
    select,
    input {
      background: #192236;
      color: var(--text);
      border: 1px solid var(--edge);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13.5px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    input[type="text"] {
      flex: 1;
      min-width: 180px;
      background: var(--bg-input);
      cursor: text;
      border: 1px solid var(--edge);
      padding: 9px 14px;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button:hover {
      border-color: var(--accent);
      background: #222f49;
    }

    button.primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-color: #38bdf8;
      color: #04101e;
      font-weight: 600;
    }

    button.primary:hover {
      box-shadow: 0 0 14px var(--accent-glow);
      transform: translateY(-1px);
    }

    button.live {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      border-color: #f43f5e;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.3);
    }

    button:disabled {
      opacity: .45;
      cursor: default;
      transform: none;
    }

    /* Quick Add Bar */
    .quickadd-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #quickAddRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quickBtn {
      font-size: 12.5px;
      padding: 6px 12px;
      background: #141c2d;
      border: 1px solid var(--edge);
      border-radius: 6px;
    }

    .quickBtn:hover:not(:disabled) {
      background: #1d283f;
      border-color: var(--accent);
      color: var(--accent);
    }

    .quickBtn.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Audio visualizer */
    #meter {
      width: 90px;
      height: 8px;
      background: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
      flex: 0 0 auto;
      border: 1px solid var(--edge);
    }

    #meterFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #38bdf8, #f43f5e);
      transition: width 60ms linear;
    }

    #globalStatus {
      color: var(--text-dim);
      font-size: 13px;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #globalStatus b {
      color: var(--ok);
      font-weight: 600;
    }

    #globalStatus.err b {
      color: var(--err);
    }

    /* Grid Layout for Channels */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .empty-state {
      color: var(--text-dim);
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      background: var(--bg-card);
      border: 1px dashed var(--edge);
      border-radius: 16px;
    }

    /* Channel Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 380px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .card.active-stream {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 24px rgba(56, 189, 248, 0.1);
    }

    .card .head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card .head .src {
      font-size: 18px;
      display: flex;
      align-items: center;
    }

    .card .head .name {
      font-weight: 600;
      font-size: 15px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill.live {
      color: var(--ok);
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
    }

    .pill.live::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--ok);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .pill.starting {
      color: var(--warn);
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.1);
    }

    .pill.error {
      color: var(--err);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.1);
    }

    .pill.stopped {
      color: var(--text-muted);
      border-color: var(--edge);
      background: #161f30;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(1.3);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .card .videoWrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
      flex: 0 0 auto;
      border: 1px solid var(--edge);
    }

    .card .videoWrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .card-actions-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .listenBtn {
      flex: 1;
      font-size: 12.5px;
      padding: 7px 12px;
      font-weight: 500;
    }

    .listenBtn.on {
      background: var(--ok);
      border-color: var(--ok);
      color: #03140e;
      font-weight: 700;
      box-shadow: 0 0 12px var(--ok-glow);
    }

    /* Dedicated Real-Time Live Subtitles Display (Immediately Below Player) */
    .live-subtitle-box {
      background: linear-gradient(180deg, #161e31, #0f1624);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      position: relative;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .live-subtitle-box.is-live {
    /* Active Live Speaking Banner */
    .live-subtitle-box {
      background: linear-gradient(180deg, #131b2e, #0c1220);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .live-subtitle-box.is-live {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      background: linear-gradient(180deg, #17223b, #0f1626);
    }

    .live-subtitle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .live-tag-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-tag-badge .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
    }

    .live-subtitle-box.is-live .live-tag-badge .dot {
      background: var(--live-red);
      animation: pulse 0.9s infinite;
    }

    .live-subtitle-box.is-live .live-tag-badge {
      color: var(--live-red);
    }

    .live-subtitle-text {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      min-height: 1.8em;
      line-height: 1.6;
    }

    .live-subtitle-text[dir="rtl"] {
      font-family: var(--nastaliq);
      font-size: 22px;
      line-height: 2.2;
      font-weight: 600;
      color: #fef08a; /* High-contrast golden yellow */
    }

    .live-subtitle-text.placeholder {
      color: var(--text-muted);
      font-style: italic;
      font-size: 13.5px;
      font-weight: 400;
    }

    /* Passed Lines Timeline Feed */
    .feed-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 6px;
      border-top: 1px solid var(--edge);
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .feed-controls {
      display: flex;
      gap: 6px;
    }

    .feed-btn {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      background: #141c2c;
      border: 1px solid var(--edge);
      color: var(--text-dim);
    }

    .feed-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: #1a253a;
    }

    .card .feed {
      flex: 1;
      overflow-y: auto;
      max-height: 260px;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .card .feed::-webkit-scrollbar {
      width: 5px;
    }

    .card .feed::-webkit-scrollbar-thumb {
      background: var(--edge);
      border-radius: 4px;
    }

    /* Finalized Segment Box */
    .card .seg {
      padding: 10px 12px;
      background: #0f1624;
      border: 1px solid #1c2638;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      position: relative;
    }

    .card .seg.just-passed {
      border-color: rgba(56, 189, 248, 0.7);
      background: #131f33;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
      animation: highlightFade 4s forwards;
    }

    @keyframes highlightFade {
      0% { border-color: #38bdf8; background: #15243d; }
      100% { border-color: #1c2638; background: #0f1624; }
    }

    .card .seg .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 11px;
      margin-bottom: 6px;
      font-family: var(--mono);
    }

    .card .seg .meta-left {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .meta-pill {
      background: #182236;
      padding: 2px 6px;
      border-radius: 4px;
      color: #94a3b8;
    }

    .new-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #03101e;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .rtf-tag {
      color: var(--ok);
      font-weight: 600;
    }

    .rtf-tag.slow {
      color: var(--warn);
    }

    .card .seg .txt {
      color: #f1f5f9;
      line-height: 1.6;
      font-size: 14px;
    }

    .card .seg .txt[dir="rtl"] {
      font-family: var(--nastaliq);
      font-size: 19px;
      line-height: 2.1;
      font-weight: 500;
      color: #f8fafc;
    }

    .card .footer-info {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Capacity Warning */
    .capacity-warning {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warn);
      color: var(--warn);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="logo-title">
        <div class="logo-badge">FAST STT</div>
        <h1>Whisper Live <small style="font-size: 13px; font-weight: 400; color: var(--text-dim);">Multi-Channel
            Broadcast & Mic</small></h1>
      </div>
      <div class="system-stats">
        <span class="stat-chip live-tag">⚡ Ultra-Low Latency</span>
        <span id="statModel" class="stat-chip">small-int8</span>
        <span id="statBackend" class="stat-chip">OpenVINO · CPU</span>
        <span id="statDb" class="stat-chip">DB ✓</span>
      </div>
    </header>

    <!-- Add Channel Bar -->
    <div class="panel">
      <div class="bar">
        <input id="chName" type="text" placeholder="Channel name (e.g. Samaa TV)" style="flex: 0 1 240px">
        <input id="chUrl" type="text" placeholder="Paste YouTube Live URL or Stream URL">
        <button id="addChannelBtn" class="primary">➕ Add Channel</button>
      </div>
    </div>

    <!-- Quick Add Row -->
    <div class="panel" style="padding: 12px 18px;">
      <div class="quickadd-title">⚡ Quick Connect Major News Streams:</div>
      <div id="quickAddRow"></div>
    </div>

    <!-- Microphone Bar -->
    <div class="panel">
      <div class="bar">
        <input id="micName" type="text" placeholder="Mic label (e.g. Studio Desk)" style="flex: 0 1 240px">
        <button id="micBtn">🎙 Start Microphone</button>
        <div id="meter">
          <div id="meterFill"></div>
        </div>
        <span id="globalStatus">connecting…</span>
      </div>
    </div>

    <div id="capacityWarning" class="capacity-warning" style="display:none"></div>

    <!-- Channels Grid -->
    <div id="channels" class="channels-grid">
      <div class="empty-state">
        <h3 style="font-size: 16px; margin-bottom: 6px; color: var(--text);">No Active Channels</h3>
        <p>Add a YouTube live stream above or start your microphone to begin real-time transcription.</p>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let ws, ctx, capNode, micStream, micSrc, myMicChannelId = null;
    const channels = new Map();
    const RTL = /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/;

    const FAMOUS_PK_CHANNELS = [
      { name: "Dunya News", url: "https://www.youtube.com/@DunyanewsOfficial/live" },
      { name: "Samaa TV", url: "https://www.youtube.com/@Samaatv/live" },
      { name: "Express News", url: "https://www.youtube.com/@ExpressNewspkofficial/live" },
      { name: "92 News HD", url: "https://www.youtube.com/@92newshdTv/live" },
      { name: "BOL News", url: "https://www.youtube.com/@BOLNewsofficial/live" },
      { name: "Aaj News", url: "https://www.youtube.com/@aajtvofficial/live" },
    ];
    const quickAddButtons = new Map();

    function renderQuickAddRow() {
      const row = $("quickAddRow");
      FAMOUS_PK_CHANNELS.forEach(ch => {
        const btn = document.createElement("button");
        btn.className = "quickBtn";
        btn.textContent = ch.name;
        btn.onclick = () => {
          if (ws?.readyState !== 1) return;
          ws.send(JSON.stringify({ type: "channel_start", source: "youtube", name: ch.name, url: ch.url, language: "ur" }));
        };
        row.appendChild(btn);
        quickAddButtons.set(ch.url, btn);
      });
    }
    renderQuickAddRow();

    // YouTube video/audio preview management
    let activeAudioChannelId = null;
    let ytApiReady = false;
    let ytApiWaiters = [];
    function loadYouTubeApi() {
      if (window.YT && window.YT.Player) { ytApiReady = true; return; }
      if (document.getElementById("ytApiScript")) return;
      const tag = document.createElement("script");
      tag.id = "ytApiScript";
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = () => {
        ytApiReady = true;
        ytApiWaiters.forEach(cb => cb());
        ytApiWaiters = [];
      };
    }
    function onYtReady(cb) { ytApiReady ? cb() : ytApiWaiters.push(cb); }

    function createPlayerForChannel(channelId, videoId) {
      const c = channels.get(channelId);
      if (!c || c.ytPlayer || !videoId || !c.videoWrapEl) return;
      c.videoId = videoId;
      loadYouTubeApi();
      onYtReady(() => {
        if (!channels.has(channelId)) return;
        c.ytPlayer = new YT.Player(c.videoWrapEl, {
          videoId,
          playerVars: { autoplay: 1, mute: 1, playsinline: 1, modestbranding: 1 },
          events: {
            onError: () => {
              c.embedBlocked = true;
              if (c.listenBtn) {
                c.listenBtn.disabled = true;
                c.listenBtn.textContent = "🚫 Preview blocked by owner — captions active";
              }
            },
          },
        });
      });
    }

    function setActiveAudio(channelId) {
      const c = channels.get(channelId);
      if (!c || !c.ytPlayer || c.embedBlocked) return;
      if (activeAudioChannelId === channelId) {
        c.ytPlayer.mute();
        activeAudioChannelId = null;
      } else {
        if (activeAudioChannelId) channels.get(activeAudioChannelId)?.ytPlayer?.mute();
        c.ytPlayer.unMute();
        c.ytPlayer.setVolume(100);
        activeAudioChannelId = channelId;
      }
      updateListenButtons();
    }

    function updateListenButtons() {
      channels.forEach((c, id) => {
        if (!c.listenBtn || c.embedBlocked) return;
        const on = id === activeAudioChannelId;
        c.listenBtn.textContent = on ? "🔊 Listening — Click to Mute" : "🔈 Listen Audio";
        c.listenBtn.classList.toggle("on", on);
      });
    }

    async function checkOversubscription() {
      try {
        const h = await (await fetch("/health")).json();
        const banner = $("capacityWarning");
        if (h.worker_threads && channels.size > h.worker_threads) {
          banner.innerHTML = `⚠ ${channels.size} channels active on ${h.worker_threads} worker threads.`;
          banner.style.display = "block";
        } else {
          banner.style.display = "none";
        }
      } catch { }
    }

    function setGlobalStatus(html, isError = false) {
      $("globalStatus").innerHTML = html;
      $("globalStatus").classList.toggle("err", isError);
    }

    function clearEmptyState() {
      const e = document.querySelector("#channels .empty-state");
      if (e) e.remove();
    }

    function addChannelCard(channel) {
      if (channels.has(channel.id)) return;
      clearEmptyState();
      const el = document.createElement("div");
      el.className = "card";
      const srcIcon = channel.source_type === "mic" ? "🎙" : "📡";
      const isYoutube = channel.source_type === "youtube";

      el.innerHTML = `
    <div class="head">
      <span class="src">${srcIcon}</span>
      <span class="name" title="${channel.name}">${channel.name}</span>
      <span class="pill ${channel.status || "starting"}">${channel.status === "starting" ? "⏳ Connecting…" : (channel.status || "starting")}</span>
      <button class="stopBtn" title="Close channel">✕</button>
    </div>
    ${isYoutube ? '<div class="videoWrap"></div><div class="card-actions-bar"><button class="listenBtn">🔈 Listen Audio</button></div>' : ''}
    
    <!-- Real-time Live Subtitle Banner -->
    <div class="live-subtitle-box">
      <div class="live-subtitle-header">
        <span class="live-tag-badge"><span class="dot"></span> LIVE CAPTIONS</span>
        <span class="live-rtf-pill meta-pill" style="font-family: var(--mono); font-size: 10px; color: var(--text-dim)">${channel.status === "live" ? "Streaming" : "Connecting"}</span>
      </div>
      <div class="live-subtitle-text placeholder">${channel.status === "live" ? "Listening for speech…" : "Connecting to stream (5–8s)…"}</div>
    </div>

    <!-- Rolling Transcript Feed (Passed Lines Timeline) -->
    <div class="feed-header">
      <div class="feed-section-title">
        <span>📜 Transcript Timeline</span>
        <span class="meta-pill line-count-badge" style="font-size: 10px;">0 lines</span>
      </div>
      <div class="feed-controls">
        <button class="feed-btn copyBtn" title="Copy all transcript text">📋 Copy All</button>
        <button class="feed-btn exportBtn" title="Download text transcript">💾 Export</button>
        <button class="feed-btn clearBtn" title="Clear timeline">🧹 Clear</button>
      </div>
    </div>
    <div class="feed"></div>
    ${channel.url ? `<div class="footer-info" title="${channel.url}">${channel.url}</div>` : ""}
  `;

      el.querySelector(".stopBtn").onclick = () => requestStopChannel(channel.id);

      const feedEl = el.querySelector(".feed");
      const liveBox = el.querySelector(".live-subtitle-box");
      const liveTextEl = el.querySelector(".live-subtitle-text");
      const liveRtfEl = el.querySelector(".live-rtf-pill");
      const lineCountBadge = el.querySelector(".line-count-badge");

      el.querySelector(".copyBtn").onclick = () => {
        const texts = Array.from(feedEl.querySelectorAll(".txt")).map(t => t.textContent.trim()).filter(Boolean);
        if (texts.length) {
          navigator.clipboard.writeText(texts.join("\n"));
          el.querySelector(".copyBtn").textContent = "✓ Copied";
          setTimeout(() => el.querySelector(".copyBtn").textContent = "📋 Copy All", 1500);
        }
      };

      el.querySelector(".exportBtn").onclick = () => {
        const texts = Array.from(feedEl.querySelectorAll(".txt")).map(t => t.textContent.trim()).filter(Boolean);
        if (!texts.length) return;
        const blob = new Blob([texts.join("\n\n")], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${channel.name.replace(/[^a-zA-Z0-9_-]/g, "_")}_transcript.txt`;
        a.click();
      };

      el.querySelector(".clearBtn").onclick = () => {
        feedEl.innerHTML = "";
        lineCountBadge.textContent = "0 lines";
      };

      $("channels").appendChild(el);

      const entry = {
        el, feedEl, liveBox, liveTextEl, liveRtfEl,
        statusEl: el.querySelector(".pill"), source_type: channel.source_type,
        videoWrapEl: isYoutube ? el.querySelector(".videoWrap") : null,
        listenBtn: isYoutube ? el.querySelector(".listenBtn") : null,
        ytPlayer: null, videoId: null, url: channel.url,
        autoScroll: true,
      };
      channels.set(channel.id, entry);

      if (isYoutube) {
        entry.listenBtn.onclick = () => setActiveAudio(channel.id);
        if (channel.video_id) createPlayerForChannel(channel.id, channel.video_id);
      }

      const quickBtn = quickAddButtons.get(channel.url);
      if (quickBtn) {
        quickBtn.classList.add("active");
        quickBtn.textContent = "✓ " + channel.name;
      }
      checkOversubscription();
    }

    function removeChannelCard(channelId) {
      const c = channels.get(channelId);
      if (!c) return;
      c.ytPlayer?.destroy?.();
      if (activeAudioChannelId === channelId) activeAudioChannelId = null;
      c.el.remove();
      channels.delete(channelId);
      const match = FAMOUS_PK_CHANNELS.find(ch => ch.url === c.url);
      const quickBtn = c.url && quickAddButtons.get(c.url);
      if (quickBtn) {
        quickBtn.classList.remove("active");
        quickBtn.textContent = match ? match.name : quickBtn.textContent;
      }
      if (channels.size === 0) {
        $("channels").innerHTML = '<div class="empty-state"><h3 style="font-size: 16px; margin-bottom: 6px; color: var(--text);">No Active Channels</h3><p>Add a YouTube live stream above or start your microphone to begin real-time transcription.</p></div>';
      }
      checkOversubscription();
    }

    function setChannelStatus(channelId, status, detail) {
      const c = channels.get(channelId);
      if (!c) return;
      c.statusEl.textContent = detail ? `${status} — ${detail}` : status;
      c.statusEl.className = `pill ${status}`;
      if (status === "live") {
        c.el.classList.add("active-stream");
      } else {
        c.el.classList.remove("active-stream");
      }
    }

    function requestStopChannel(channelId) {
      if (channelId === myMicChannelId) stopMicLocal();
      ws?.readyState === 1 && ws.send(JSON.stringify({ type: "channel_stop", channel_id: channelId }));
    }

    async function connect() {
      try {
        const h = await (await fetch("/health")).json();
        if (h.model) $("statModel").textContent = (h.model || "").split(/[\/\\]/).pop();
        if (h.backend && h.device) $("statBackend").textContent = `${h.backend} · ${h.device}`;
        $("statDb").textContent = h.database === "connected" ? "DB ✓" : "DB ✗";
      } catch { }

      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => setGlobalStatus("<b>⚡ Connected</b>");
      ws.onclose = () => setGlobalStatus("Disconnected — reload page", true);
      ws.onerror = () => setGlobalStatus("Connection error", true);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);

        if (m.type === "channels_snapshot") {
          m.channels.forEach(addChannelCard);
          return;
        }
        if (m.type === "channel_added") { addChannelCard(m.channel); return; }
        if (m.type === "channel_removed") { removeChannelCard(m.channel_id); return; }
        if (m.type === "mic_channel_ready") { myMicChannelId = m.channel_id; return; }

        if (m.type === "error" && !m.channel_id) { setGlobalStatus(`<b>Error</b> — ${m.detail}`, true); return; }

        const c = channels.get(m.channel_id);
        if (!c) return;

        if (m.type === "error") {
          setChannelStatus(m.channel_id, "error", m.detail);
          return;
        }
        if (m.type === "stream_status") {
          if (m.state === "started") {
            setChannelStatus(m.channel_id, "live");
            c.liveTextEl.textContent = "Listening for speech…";
            c.liveRtfEl.textContent = "Streaming";
            if (m.video_id) createPlayerForChannel(m.channel_id, m.video_id);
          } else if (m.state === "error") {
            setChannelStatus(m.channel_id, "error", m.detail);
            c.liveTextEl.textContent = `Error connecting stream: ${m.detail || "URL unreachable"}`;
          } else if (m.state === "ended" || m.state === "stopped") {
            setChannelStatus(m.channel_id, "stopped");
            c.liveTextEl.textContent = "Stream ended.";
          }
          return;
        }
        if (m.type === "partial") {
          if (!m.text) {
            c.liveBox.classList.remove("is-live");
            return;
          }
          c.liveBox.classList.add("is-live");
          c.liveTextEl.classList.remove("placeholder");
          c.liveTextEl.setAttribute("dir", RTL.test(m.text) ? "rtl" : "ltr");
          c.liveTextEl.textContent = m.text;
          c.liveRtfEl.textContent = "● streaming";
          if (c.statusEl.textContent === "starting") setChannelStatus(m.channel_id, "live");
          return;
        }
        if (m.type === "segment") {
          setChannelStatus(m.channel_id, "live");
          c.liveBox.classList.remove("is-live");
          if (m.rtf) {
            c.liveRtfEl.textContent = `${m.rtf}× RT (${m.infer_s}s)`;
            c.liveRtfEl.style.color = m.rtf >= 1.0 ? "var(--ok)" : "var(--warn)";
          }

          // Clear previous 'just-passed' highlights
          c.feedEl.querySelectorAll(".seg.just-passed").forEach(el => {
            el.classList.remove("just-passed");
            el.querySelector(".new-badge")?.remove();
          });

          const rtl = RTL.test(m.text);
          const slow = m.rtf != null && m.rtf < 1;
          const fmtT0 = formatTime(m.t0);
          const fmtT1 = formatTime(m.t1);
          const row = document.createElement("div");
          row.className = "seg just-passed";
          row.innerHTML = `
        <div class="meta">
          <div class="meta-left">
            <span class="new-badge">✨ NEW</span>
            <span class="meta-pill">${fmtT0} → ${fmtT1}</span>
            <span class="meta-pill">${m.lang.toUpperCase()}</span>
          </div>
          <div>
            ${m.rtf ? `<span class="rtf-tag ${slow ? 'slow' : ''}">${m.rtf}× RT</span> · ` : ''}<span>${m.infer_s}s</span>
          </div>
        </div>
        <div class="txt" dir="${rtl ? 'rtl' : 'ltr'}"></div>
      `;
          row.querySelector(".txt").textContent = m.text;
          c.feedEl.prepend(row);
          c.feedEl.scrollTop = 0;

          const totalLines = c.feedEl.querySelectorAll(".seg").length;
          const countBadge = c.el.querySelector(".line-count-badge");
          if (countBadge) {
            countBadge.textContent = `${totalLines} line${totalLines === 1 ? '' : 's'}`;
          }

          // Clear live subtitle box after brief flash so it does not look stuck
          setTimeout(() => {
            if (!c.liveBox.classList.contains("is-live")) {
              c.liveTextEl.classList.add("placeholder");
              c.liveTextEl.textContent = "Listening for speech...";
            }
          }, 800);

          if (slow) checkOversubscription();
        }
      };
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    async function ensureAudio() {
      if (ctx) return;
      ctx = new AudioContext({ sampleRate: 16000 });
      const workletCode = `
    class Cap extends AudioWorkletProcessor {
      constructor() { super(); this.parts = []; this.n = 0; }
      process(inputs) {
        const ch = inputs[0][0];
        if (ch) {
          this.parts.push(new Float32Array(ch)); this.n += ch.length;
          if (this.n >= 2048) {
            const out = new Float32Array(this.n); let o = 0;
            for (const p of this.parts) { out.set(p, o); o += p.length; }
            this.port.postMessage(out.buffer, [out.buffer]);
            this.parts = []; this.n = 0;
          }
        }
        return true;
      }
    }
    registerProcessor("cap", Cap);`;
      const url = URL.createObjectURL(new Blob([workletCode], { type: "application/javascript" }));
      await ctx.audioWorklet.addModule(url);
      capNode = new AudioWorkletNode(ctx, "cap");
      capNode.port.onmessage = e => {
        if (ws?.readyState === 1 && myMicChannelId) ws.send(e.data);
        const a = new Float32Array(e.data);
        let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i];
        const lvl = Math.min(100, Math.sqrt(s / a.length) * 700);
        $("meterFill").style.width = lvl + "%";
      };
      capNode.connect(ctx.destination);
    }

    async function startMic() {
      await ensureAudio(); await ctx.resume();
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
      micSrc = ctx.createMediaStreamSource(micStream);
      micSrc.connect(capNode);
      ws.send(JSON.stringify({
        type: "channel_start", source: "mic",
        name: $("micName").value.trim() || "Microphone", language: "ur",
      }));
      $("micBtn").textContent = "⏹ Stop Microphone";
      $("micBtn").classList.add("live");
    }

    function stopMicLocal() {
      micSrc?.disconnect(); micStream?.getTracks().forEach(t => t.stop());
      micSrc = micStream = null; myMicChannelId = null;
      $("micBtn").textContent = "🎙 Start Microphone";
      $("micBtn").classList.remove("live");
      $("meterFill").style.width = "0%";
    }

    $("micBtn").onclick = () => {
      if (myMicChannelId) { requestStopChannel(myMicChannelId); return; }
      startMic().catch(e => {
        const hint = e.name === "NotAllowedError"
          ? "Microphone access blocked — allow permission in your browser"
          : e.name === "NotFoundError" ? "No microphone found"
            : "Mic error: " + e.message;
        setGlobalStatus(hint, true);
      });
    };

    $("addChannelBtn").onclick = () => {
      const url = $("chUrl").value.trim();
      if (!url) { setGlobalStatus("Please paste a YouTube URL first", true); return; }
      const name = $("chName").value.trim() || "Channel";
      ws.send(JSON.stringify({ type: "channel_start", source: "youtube", name, url, language: "ur" }));
      $("chName").value = ""; $("chUrl").value = "";
    };
    $("chUrl").addEventListener("keydown", e => { if (e.key === "Enter") $("addChannelBtn").click(); });

    connect();
  </script>
</body>

</html>
